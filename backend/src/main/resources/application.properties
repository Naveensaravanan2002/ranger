spring.application.name=ranger
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.connection-timeout=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
spring.datasource.url=jdbc:h2:mem:ranger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
ranger.firebase.project-id=${FIREBASE_PROJECT_ID:}
ranger.cors.origins=${RANGER_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
ranger.gmail.enabled=${RANGER_GMAIL_TEST_MODE:false}
ranger.gmail.client-id=${RANGER_GMAIL_CLIENT_ID:}
ranger.gmail.testers=${RANGER_GMAIL_TESTERS:}

# Containers fail closed unless the persistent Neon profile is explicitly selected.
ranger.require-persistent=${RANGER_REQUIRE_PERSISTENT_DB:false}
