# Profile "neon": run the reviewed SQL script in db/schema/001_initial.sql first.
# Values come from your existing IntelliJ environment variables. Never commit secrets.
spring.datasource.url=jdbc:postgresql://${RANGER_DB_HOST}/${RANGER_DB_NAME:neondb}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&channelBinding=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${RANGER_DB_USER}
spring.datasource.password=${RANGER_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
